<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astrophotography - Portfolio</title>
  <meta name="description" content="High-end editorial photography portfolio.">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  
    <header>
      <div class="header-left">
        <button class="hamburger">
          <span></span>
          <span></span>
        </button>
        <div class="nav-links">
          <a href="../index.html" class="nav-link ">PORTFOLIO</a>
        </div>
      </div>
      <div class="logo"><a href="../index.html">Nathan So</a></div>
      <div class="header-right">
        <!-- Empty for balance on desktop -->
      </div>
    </header>
    
    <div class="mobile-menu">
      <a href="../index.html" class="nav-link">PORTFOLIO</a>
    </div>
    
  <main>
    
        <div class="project-hero">
          <h1 class="project-title">Astrophotography</h1>
        </div>
        <div class="masonry">
          <div class="masonry-column">
                <div class="masonry-item">
                  <img src="../assets/gallery/astrophotography/TBP04899.webp" alt="Gallery image" loading="lazy" decoding="async">
                  
                </div>
                
                <div class="masonry-item">
                  <img src="../assets/gallery/astrophotography/mily-way-v2.webp" alt="Gallery image" loading="lazy" decoding="async">
                  
                </div>
                </div><div class="masonry-column">
                <div class="masonry-item">
                  <img src="../assets/gallery/astrophotography/TBP04901.webp" alt="Gallery image" loading="lazy" decoding="async">
                  
                </div>
                
                <div class="masonry-item">
                  <img src="../assets/gallery/astrophotography/Astro150.webp" alt="Gallery image" loading="lazy" decoding="async">
                  
                </div>
                </div><div class="masonry-column">
                <div class="masonry-item">
                  <img src="../assets/gallery/astrophotography/Astro077.webp" alt="Gallery image" loading="lazy" decoding="async">
                  
                </div>
                
                <div class="masonry-item">
                  <img src="../assets/gallery/astrophotography/TBP04942_02.webp" alt="Gallery image" loading="lazy" decoding="async">
                  
                </div>
                </div>
        </div>
        
    <div class="lightbox" id="lightbox">
      <button class="lightbox-close">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="lightbox-controls">
        <button class="lightbox-prev">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button class="lightbox-next">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
      <div class="lightbox-content">
        <img src="" alt="" class="lightbox-img" id="lightbox-img">
        <span class="device-note lightbox-note" id="lightbox-note">*taken with iPhone</span>
      </div>
    </div>
    
        
  </main>
  
    <footer>
      <div class="footer-left">
        <div class="footer-label">CONTACT VIA</div>
        <div class="footer-links" style="position: relative;">
          <button class="email-copy-btn" id="email-btn">n_so@ucsb.edu</button>
          <div class="copy-popup" id="copy-popup">Copied to clipboard</div>
        </div>
      </div>
      <div class="footer-right">
        <div class="logo-mark">© 2026</div>
      </div>
    </footer>
    
  <script src="../scripts.js"></script>
</body>
</html>
